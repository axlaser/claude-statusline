[package]
name = "claude-statusline"
version = "1.0.0"
edition = "2021"
description = "Cross-platform custom status line for Claude Code"
license = "MIT"
repository = "https://github.com/axlaser/claude-statusline"
# Two binaries: `cargo run` needs to be told which one.
default-run = "claude-statusline"

[lib]
name = "claude_statusline"
path = "src/lib.rs"

[[bin]]
name = "claude-statusline"
path = "src/main.rs"

# The Windows click helper: built everywhere so the entry contract
# covers it on every host, shipped only for Windows. `test = false` because
# the integration test file drives it as a process instead.
[[bin]]
name = "claude-statusline-focus"
path = "src/bin/focus.rs"
test = false

[dependencies]
# `preserve_order` keeps settings.json's keys in the user's order, so an
# install's diff shows only the entries it added rather than a re-sorted file.
# jq, which the shell installers used, preserves order too.
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
# Test-only: proves the icon hash the installers pin matches the asset in the
# repo. The shipped binary keeps its zero runtime dependencies.
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_Console",
    # The notification sound, played in-process as the shipped handler did;
    # spawning a player would be a second process on every notification.
    "Win32_Media_Audio",
    # Click-to-focus: `ProcessPrng` for the token, the standard library's own
    # source; Toolhelp for walking the parent chain to the anchor.
    "Win32_Security_Cryptography",
    "Win32_System_Diagnostics_ToolHelp",
    # Click-to-focus: finding the terminal window and marking it with a
    # window property at capture, verified at click.
    "Win32_UI_WindowsAndMessaging",
    # Click-to-focus: the per-user URI handler under HKCU\Software\Classes
    # is read on every visual alert and written by `settings protocol`.
    "Win32_System_Registry",
    # Click-to-focus: the foreground recipe registers a hotkey and
    # sends it, and skips its own verification under a debugger.
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_Debug",
    # `WNDCLASSW` carries a brush handle, so its bindings sit behind Gdi.
    "Win32_Graphics_Gdi",
] }

# The top-level catch_unwind is a no-op under `panic = "abort"`, so the
# release profile must keep unwinding panics. Do not "optimize" this away.
[profile.release]
panic = "unwind"
opt-level = 3
