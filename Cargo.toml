[package]
name = "claude-statusline"
version = "1.0.0"
edition = "2021"
description = "Cross-platform custom status line for Claude Code"
license = "MIT"
repository = "https://github.com/axlaser/claude-statusline"

[lib]
name = "claude_statusline"
path = "src/lib.rs"

[[bin]]
name = "claude-statusline"
path = "src/main.rs"

[dependencies]
# `preserve_order` keeps settings.json's existing keys in the user's order
# instead of re-sorting them alphabetically. Without it, installing rewrites the
# whole file and the diff shows every line rather than only the entries the
# installer meant to add — which is both alarming to read and useless as
# verification. jq, which the shell installers used, preserves order too.
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
# Test-only: proves the icon hash the installers pin matches the asset in the
# repo. The shipped binary keeps its zero runtime dependencies.
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_Console",
    # U7: the notification sound, played in-process as the shipped handler did
    # through System.Media.SoundPlayer. Spawning a player instead would be a
    # visible behaviour change and a second process on every notification.
    "Win32_Media_Audio",
    # Click-to-focus: the token's random bytes come from `ProcessPrng`, the
    # source the standard library itself uses (KTD13), and the anchor process
    # is found by walking the Toolhelp parent chain.
    "Win32_Security_Cryptography",
    "Win32_System_Diagnostics_ToolHelp",
    # Click-to-focus: the terminal window is found through the console's
    # root owner or the parent chain's windows (KTD6), marked with a window
    # property at capture and verified through it at click (KTD9).
    "Win32_UI_WindowsAndMessaging",
] }

# KTD7: the top-level catch_unwind is a no-op under `panic = "abort"`, so the
# release profile must keep unwinding panics. Do not "optimize" this away.
[profile.release]
panic = "unwind"
opt-level = 3
