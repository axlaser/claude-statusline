name: release

# Two triggers produce the same eight native artifacts -- the binary for six
# targets and the Windows click helper for the two Windows targets -- one
# `checksums.txt`, and one Sigstore bundle per artifact:
#
#   - a tagged push is a release: stable for exactly vX.Y.Z, a prerelease for
#     any other tag shape;
#   - a push to `dev` is the dev channel: one prerelease, tagged `dev-channel`,
#     whose assets and notes are replaced in place on every push. The installers
#     reach it through `--dev` and nothing else resolves it. One release rather
#     than one per push, so the Releases page never fills with builds; one tag
#     that is created on the first run and never moved, because a moving tag
#     makes every clone's next `git fetch` fail with "would clobber existing
#     tag". So the tag does not say which commit a build came from -- the notes
#     name it and the attestation proves it. A head commit whose message
#     carries `[skip release]` publishes nothing.
#
# Artifact packaging was left open. Decision: publish raw binaries, not archives.
# The installers are POSIX sh and PowerShell with no unpacking dependency, and a
# raw artifact lets the checksum gate hash exactly the bytes it places.
#
# Every target builds and tests on its own native runner. The one
# exception is `x86_64-apple-darwin`: GitHub withdrew free macOS x86 runners, so
# it is cross-built on the arm64 runner and its tests run under Rosetta 2, with
# the job failing rather than skipping when Rosetta is unavailable.
#
# No C toolchain is installed anywhere in this workflow, and none may be added.
# The musl legs link self-contained because every dependency is pure Rust or
# FFI declarations only; adding a libgit2-backed crate would drag
# `musl-tools` back in and invalidate this matrix.

on:
  push:
    # The dev channel. The `dev-channel` tag its first run creates never
    # re-triggers it: it is created with the workflow token, whose events start
    # no runs, and it matches no pattern below.
    branches:
      - dev
    tags:
      # Stable releases.
      - "v[0-9]+.[0-9]+.[0-9]+"
      # Pipeline-verification tags. Published as prereleases so the
      # installer's `releases/latest` resolution skips them, and deleted
      # once the pipeline is verified.
      - "v[0-9]+.[0-9]+.[0-9]+-*"
      - "verify-*"

# Read-only at workflow scope. The elevated grants live on the single attesting
# and publishing job below.
permissions:
  contents: read

# A tag's run is never cancelled. A dev-channel run is superseded by the next
# push to the branch, so the one in flight stops and its minutes are spared;
# the window where a cancellation could interrupt publishing is one step long,
# and the next run replaces every asset anyway.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: never

jobs:
  # Runs before anything is built, because the failure it catches is silent: a
  # tag and a Cargo.toml that disagree publish happily, and the mismatch only
  # surfaces later when someone asks the artifact what version it is. Cheap to
  # check, expensive to discover after six targets have built.
  version:
    name: name the release and check the version
    runs-on: ubuntu-24.04
    # `[skip release]` in the head commit's message skips a dev-channel run: a
    # docs-only push has nothing new to publish and six targets to build. A tag
    # never skips, because it was pushed deliberately. Every later job needs
    # this one, so skipping it skips the run.
    #
    # Anywhere in the message, body included, exactly as GitHub's own
    # `[skip ci]` matches. The commit that introduced the marker skipped its own
    # run by naming it in the body, so a commit that talks about the marker has
    # to spell it some other way.
    if: github.ref_type == 'tag' || !contains(github.event.head_commit.message, '[skip release]')
    outputs:
      tag: ${{ steps.name.outputs.tag }}
      title: ${{ steps.name.outputs.title }}
      dev: ${{ steps.name.outputs.dev }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Named once, here, and read by every later job. A tag names itself. A
      # push to `dev` names the one dev-channel release, whose tag the first
      # run creates and no later run moves; the title carries the commit and
      # the day, so the release listing says what the assets currently are.
      - name: Name the release
        id: name
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            {
              echo "tag=${GITHUB_REF_NAME}"
              echo "title=${GITHUB_REF_NAME}"
              echo "dev=false"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "tag=dev-channel"
              echo "title=dev-channel: dev @ ${GITHUB_SHA::7} ($(date -u +%Y-%m-%d))"
              echo "dev=true"
            } >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      - name: The tag and the crate version agree
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME}"
          # `verify-*` tags are pipeline checks and claim no version, so there
          # is nothing for them to disagree with. The digit matters: `verify-x`
          # also begins with a v, and a bare `v*` guard would strip it to
          # "erify" and fail every verification tag.
          case "$tag" in
            v[0-9]*) ;;
            *) echo "::notice::$tag claims no version; skipping the check." ; exit 0 ;;
          esac
          # v1.2.3 and v1.2.3-rc.1 both claim crate version 1.2.3.
          claimed="${tag#v}"
          claimed="${claimed%%-*}"
          actual=$(grep -m1 -E '^version[[:space:]]*=' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "tag claims $claimed; Cargo.toml declares $actual"
          if [ "$claimed" != "$actual" ]; then
            echo "::error::Tag $tag claims version $claimed but Cargo.toml declares $actual. Bump Cargo.toml or retag."
            exit 1
          fi

      # Resolved here rather than in the publishing job on purpose. That job
      # holds the signing and release grants and deliberately has no checkout;
      # handing it the notes as an artifact keeps it that way.
      - name: Resolve the release notes
        env:
          DEV: ${{ steps.name.outputs.dev }}
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          mkdir -p out
          if [ "$DEV" = "true" ]; then
            # The dev channel announces what it is rather than what changed:
            # the branch head at this commit, replaced on the next push.
            {
              printf 'Dev channel: the dev branch at %s, built %s.\n\n' \
                "${GITHUB_SHA::7}" "$(date -u +%Y-%m-%d)"
              printf 'This is not a release. It tracks the integration branch, may be broken on any given day, and is replaced by the next push. The dev-channel tag anchors this release and does not point at the commit above; the attestation on each asset does. Install it with --dev from the installer on the dev branch:\n\n'
              printf '    curl -fsSL https://raw.githubusercontent.com/%s/dev/install/install.sh | bash -s -- --dev\n\n' \
                "$GITHUB_REPOSITORY"
              printf 'Verify before use:\n\n    sha256sum --check --ignore-missing checksums.txt\n    gh attestation verify claude-statusline-<target> --repo %s\n' \
                "$GITHUB_REPOSITORY"
            } > out/notes.md
            echo "dev channel: wrote the notes for ${GITHUB_SHA::7}"
          elif [ -f "$notes" ]; then
            cp "$notes" out/notes.md
            echo "using $notes ($(wc -l < "$notes") lines)"
          else
            # A tag with no notes still publishes — a verification tag has
            # nothing to announce, and a missing file must not block a release
            # that is otherwise sound.
            printf 'Verify before use:\n\n    sha256sum --check --ignore-missing checksums.txt\n    gh attestation verify claude-statusline-<target> --repo %s\n' \
              "${GITHUB_REPOSITORY}" > out/notes.md
            echo "::notice::No notes at $notes; publishing the verification boilerplate."
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-notes
          path: out/notes.md
          if-no-files-found: error
          retention-days: 7

  build:
    name: build ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
            family: darwin
            ext: ""
          - target: x86_64-apple-darwin
            runner: macos-15
            family: darwin
            ext: ""
            rosetta: true
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            family: linux
            ext: ""
            alpine: alpine:3.21
          - target: aarch64-unknown-linux-musl
            # Pinned to the explicit arm label, never an alias.
            runner: ubuntu-24.04-arm
            family: linux
            ext: ""
            alpine: alpine:3.21
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            family: windows
            ext: ".exe"
          - target: aarch64-pc-windows-msvc
            # Pinned to the explicit arm label, never an alias.
            runner: windows-11-arm
            family: windows
            ext: ".exe"

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Rosetta has to exist before `cargo test --target x86_64-apple-darwin`
      # tries to execute an x86 test binary on the arm64 runner. A failure here is
      # required rather than a skipped case table.
      - name: Require Rosetta 2
        if: matrix.rosetta
        run: |
          softwareupdate --install-rosetta --agree-to-license
          if ! arch -x86_64 /usr/bin/true; then
            echo "::error::Rosetta 2 is unavailable, so the x86_64-apple-darwin case table cannot run."
            exit 1
          fi
          echo "Rosetta 2 verified: an x86_64 process executes on $(uname -m)."

      - name: Install the target
        run: |
          rustup target add "${{ matrix.target }}"
          rustc --version
          cargo --version

      - name: Build
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Test on the target
        run: cargo test --release --locked --target "${{ matrix.target }}"

      # Apple Silicon SIGKILLs an unsigned arm64 binary and recent
      # macOS rejects the bare linker signature too. Under the silent-degradation
      # contract that surfaces as a status line that is simply absent, with
      # nothing on stderr and no way for the user to tell why — so signing is a
      # correctness gate here, not packaging polish.
      #
      # Signing runs after the test step on purpose: cargo relinking the bin for
      # the integration test would drop a signature applied before it, and the
      # smoke step below then exercises the exact bytes that ship.
      - name: Ad-hoc code sign
        if: matrix.family == 'darwin'
        run: |
          bin="target/${{ matrix.target }}/release/claude-statusline"
          codesign --sign - --force --timestamp=none "$bin"
          codesign --verify --strict --verbose=2 "$bin"

      - name: Smoke the artifact
        run: |
          bin="target/${{ matrix.target }}/release/claude-statusline${{ matrix.ext }}"
          "$bin" self-check
          printf '' | "$bin" > /dev/null

      # The click helper ships for Windows only. Run with no arguments
      # it must exit 0 and stay silent, which is its whole contract from the
      # shell's point of view; bash waits for a GUI-subsystem process where
      # PowerShell's `&` would not.
      - name: Smoke the click helper
        if: matrix.family == 'windows'
        run: |
          helper="target/${{ matrix.target }}/release/claude-statusline-focus${{ matrix.ext }}"
          out=$("$helper" 2>&1)
          test -z "$out" || { echo "::error::the helper wrote output: $out"; exit 1; }

      # A dynamically linked artifact would still pass every step above on
      # the build host and fail only on the user's older distribution.
      - name: Verify static linking
        if: matrix.family == 'linux'
        run: |
          bin="target/${{ matrix.target }}/release/claude-statusline"
          desc=$(file "$bin")
          echo "$desc"
          # The two musl targets describe themselves differently and both are
          # static: aarch64 links non-PIE and reads "statically linked", x86_64
          # links a static PIE and reads "static-pie linked". Matching only the
          # first spelling fails the x86_64 leg on a binary that is correct.
          case "$desc" in
            *"statically linked"*|*"static-pie linked"*) ;;
            *)
              echo "::error::${{ matrix.target }} is not statically linked."
              exit 1
              ;;
          esac
          # Asserted separately rather than trusted as the complement of the
          # above: only a dynamic binary carries an interpreter, and that is the
          # thing that actually breaks on an older loader.
          case "$desc" in
            *"dynamically linked"*|*"interpreter"*)
              echo "::error::${{ matrix.target }} carries a dynamic loader dependency."
              exit 1
              ;;
          esac

      - name: Run on Alpine
        if: matrix.family == 'linux'
        run: |
          docker run --rm \
            -v "$PWD/target/${{ matrix.target }}/release:/artifact:ro" \
            "${{ matrix.alpine }}" /artifact/claude-statusline self-check

      - name: Stage the artifact
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/claude-statusline${{ matrix.ext }}" \
             "dist/claude-statusline-${{ matrix.target }}${{ matrix.ext }}"

      - name: Stage the click helper
        if: matrix.family == 'windows'
        run: |
          cp "target/${{ matrix.target }}/release/claude-statusline-focus${{ matrix.ext }}" \
             "dist/claude-statusline-focus-${{ matrix.target }}${{ matrix.ext }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binary-${{ matrix.target }}
          path: dist/claude-statusline-*
          if-no-files-found: error
          retention-days: 7

  # Aggregation runs read-only and separately from publishing, so the job
  # holding the signing and release grants does as little as possible.
  checksums:
    name: aggregate checksums
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist

      - name: Emit checksums.txt
        run: |
          cd dist
          # Six binaries and the two Windows click helpers.
          count=$(find . -maxdepth 1 -type f -name 'claude-statusline-*' | wc -l)
          if [ "$count" -ne 8 ]; then
            echo "::error::expected 8 artifacts, found $count."
            ls -la
            exit 1
          fi
          # LC_ALL=C so the file order does not drift with the runner locale.
          find . -maxdepth 1 -type f -name 'claude-statusline-*' -printf '%f\n' \
            | LC_ALL=C sort \
            | xargs sha256sum > checksums.txt
          cat checksums.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: checksums
          path: dist/checksums.txt
          if-no-files-found: error
          retention-days: 7

  release:
    name: attest and publish
    # `version` is listed as well as reached through `checksums`: the `needs`
    # context carries only direct dependencies, and this job reads the name.
    needs: [checksums, version]
    runs-on: ubuntu-24.04
    permissions:
      # The only job with anything beyond read. `id-token` mints the OIDC token
      # for the Sigstore certificate, `attestations` persists the attestation,
      # `artifact-metadata` creates the storage record, `contents` publishes.
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: checksums
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-notes
          path: notes

      - name: Classify the release
        id: tag
        env:
          TAG: ${{ needs.version.outputs.tag }}
          DEV: ${{ needs.version.outputs.dev }}
        run: |
          # Anything that is not exactly vMAJOR.MINOR.PATCH is a prerelease, and
          # the dev channel always is. Failing toward "prerelease" keeps an
          # unexpected tag shape out of the installer's resolution rather than
          # shipping it to every user.
          if [ "$DEV" != "true" ] && printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # A step here used to refuse every stable tag outright, so that no release
      # could ship before the port had proved parity with the scripts it
      # replaced. That was satisfied on 2026-07-28 — the case table green on all
      # six published targets, and live sessions on macOS and Linux with
      # notifications confirmed on both channels — so the refusal is gone and a
      # stable tag now publishes.
      #
      # What still stands between an accident and a release: a tag has to be
      # pushed deliberately, the version job refuses a tag that disagrees with
      # Cargo.toml, and anything that is not exactly vX.Y.Z publishes as a
      # prerelease that `releases/latest` skips.

      # Re-verifying here rather than trusting the aggregation job proves the
      # recorded checksum matches the bytes this job is about to attest and
      # publish.
      - name: Verify checksums against the artifacts
        run: |
          cd dist
          sha256sum --check --strict checksums.txt

      - name: Attest aarch64-apple-darwin
        id: attest-aarch64-apple-darwin
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: dist/claude-statusline-aarch64-apple-darwin

      - name: Attest x86_64-apple-darwin
        id: attest-x86_64-apple-darwin
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: dist/claude-statusline-x86_64-apple-darwin

      - name: Attest x86_64-unknown-linux-musl
        id: attest-x86_64-unknown-linux-musl
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: dist/claude-statusline-x86_64-unknown-linux-musl

      - name: Attest aarch64-unknown-linux-musl
        id: attest-aarch64-unknown-linux-musl
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: dist/claude-statusline-aarch64-unknown-linux-musl

      - name: Attest x86_64-pc-windows-msvc
        id: attest-x86_64-pc-windows-msvc
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: dist/claude-statusline-x86_64-pc-windows-msvc.exe

      - name: Attest aarch64-pc-windows-msvc
        id: attest-aarch64-pc-windows-msvc
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: dist/claude-statusline-aarch64-pc-windows-msvc.exe

      # One attest step per asset, the click helpers included: the installer
      # verifies each file it places against its own bundle.
      - name: Attest focus x86_64-pc-windows-msvc
        id: attest-focus-x86_64-pc-windows-msvc
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: dist/claude-statusline-focus-x86_64-pc-windows-msvc.exe

      - name: Attest focus aarch64-pc-windows-msvc
        id: attest-focus-aarch64-pc-windows-msvc
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: dist/claude-statusline-focus-aarch64-pc-windows-msvc.exe

      # The bundle ships as a release asset so verification does not
      # need an authenticated GitHub CLI: the attestation API serves its bundle
      # Snappy-compressed, which a shell installer cannot decode.
      - name: Collect the Sigstore bundles
        run: |
          cp "${{ steps.attest-aarch64-apple-darwin.outputs.bundle-path }}"       dist/claude-statusline-aarch64-apple-darwin.sigstore.json
          cp "${{ steps.attest-x86_64-apple-darwin.outputs.bundle-path }}"        dist/claude-statusline-x86_64-apple-darwin.sigstore.json
          cp "${{ steps.attest-x86_64-unknown-linux-musl.outputs.bundle-path }}"  dist/claude-statusline-x86_64-unknown-linux-musl.sigstore.json
          cp "${{ steps.attest-aarch64-unknown-linux-musl.outputs.bundle-path }}" dist/claude-statusline-aarch64-unknown-linux-musl.sigstore.json
          cp "${{ steps.attest-x86_64-pc-windows-msvc.outputs.bundle-path }}"     dist/claude-statusline-x86_64-pc-windows-msvc.exe.sigstore.json
          cp "${{ steps.attest-aarch64-pc-windows-msvc.outputs.bundle-path }}"    dist/claude-statusline-aarch64-pc-windows-msvc.exe.sigstore.json
          cp "${{ steps.attest-focus-x86_64-pc-windows-msvc.outputs.bundle-path }}"  dist/claude-statusline-focus-x86_64-pc-windows-msvc.exe.sigstore.json
          cp "${{ steps.attest-focus-aarch64-pc-windows-msvc.outputs.bundle-path }}" dist/claude-statusline-focus-aarch64-pc-windows-msvc.exe.sigstore.json
          bundles=$(find dist -maxdepth 1 -type f -name '*.sigstore.json' | wc -l)
          if [ "$bundles" -ne 8 ]; then
            echo "::error::expected 8 Sigstore bundles, found $bundles."
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          TITLE: ${{ needs.version.outputs.title }}
          DEV: ${{ needs.version.outputs.dev }}
          REPO: ${{ github.repository }}
        run: |
          # --repo is required, not decorative: this job downloads artifacts and
          # never checks out the repository, so gh has no git remote to infer
          # from and fails with "not a git repository". Adding a checkout just to
          # give it that context would widen the surface of the one job holding
          # the signing and release permissions.
          if [ "$DEV" = "true" ] && gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            # The one dev-channel release exists: replace its assets and notes
            # in place. The tag stays where the first run put it. An install
            # that straddles the replacement sees a checksum mismatch and
            # refuses, which is the fail-closed direction; re-running it works.
            gh release upload "$TAG" --repo "$REPO" --clobber \
              dist/claude-statusline-* \
              dist/checksums.txt
            gh release edit "$TAG" \
              --repo "$REPO" \
              --title "$TITLE" \
              --notes-file notes/notes.md \
              --prerelease
          else
            flags=()
            if [ "${{ steps.tag.outputs.prerelease }}" = "true" ]; then
              flags+=(--prerelease)
            fi
            if [ "$DEV" = "true" ]; then
              # First run of the channel: the tag does not exist yet, so gh
              # creates it, and --target is what points that at the pushed
              # commit rather than the default branch's head.
              flags+=(--target "$GITHUB_SHA")
            fi
            # A tagged release is never replaced: a re-run of a tag's workflow
            # still fails on the release that exists, as it always has.
            gh release create "$TAG" \
              --repo "$REPO" \
              --title "$TITLE" \
              --notes-file notes/notes.md \
              "${flags[@]}" \
              dist/claude-statusline-* \
              dist/checksums.txt
          fi
