name: ci

# The gates every commit has to pass, on every platform the tool ships to.
#
# This exists because for a while nothing ran them off a tag: `release.yml` is
# thorough but only fires on a tag push, so a branch could accumulate commits
# that had never been compiled anywhere but the maintainer's machine. The first
# sign of a break would then be a failed release run with the tag already
# pushed, which is the worst place to learn it.
#
# Three native runners rather than the release matrix's six targets: this
# answers "does the code work on this OS", and the release workflow answers
# "does every published artifact build and pass its table".

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  gates:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Toolchain
        run: |
          rustup component add clippy rustfmt
          rustc --version
          cargo --version

      # Formatting first: it is the cheapest failure and needs no build.
      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      # The installer's gate, run here too so a renderer that drifts from its
      # compiled-in fixture fails on a branch rather than at install time.
      - name: Self-check
        run: cargo run --locked --quiet -- self-check

  # Runs the installers. Nothing did, until three defects shipped past a green
  # `gates` matrix on all three platforms: a stale `$LASTEXITCODE` that let an
  # unlaunchable binary pass the self-check gate and go on to delete a migrating
  # user's scripts, a `BaseResponse.ResponseUri` read that does not exist on
  # PowerShell 7 and aborted every stable install there, and a release sentinel
  # that guarded against the literal `latest` while the real redirect lands on
  # `releases`. All three are control flow, and `tests/equivalence.rs` can only
  # assert properties of the script *text*, so none of them was visible to
  # anything that existed.
  #
  # The install is the product's front door and the only part of it that edits a
  # user's existing configuration. It gets executed here, or it gets executed
  # for the first time by whoever installs first.
  #
  # Every leg runs under bash so the interpreter under test is named explicitly
  # and its stdin can be closed. That is load-bearing rather than tidiness: the
  # notification prompt has no terminal here, and `< /dev/null` is what makes
  # PowerShell's `Read-Host` and bash's `read </dev/tty` both decline and carry
  # on instead of hanging the job.
  #
  # `--pre` because the stable channel has nothing to resolve until a vX.Y.Z tag
  # exists. It performs the same resolution, download, checksum, attestation,
  # placement, self-check and settings merge that the stable channel does. Not
  # `--dev`: the dev-channel build for this very push is being produced in
  # parallel, so that would install the previous push's assets, or nothing at
  # all on the first.
  installers:
    name: install ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: gates

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux
            run: bash install/install.sh
            undo: bash install/uninstall.sh
            bin: claude-statusline
          - os: macos-15
            name: macos
            run: bash install/install.sh
            undo: bash install/uninstall.sh
            bin: claude-statusline
          # Both Windows editions, deliberately. Where this script is concerned
          # they are different programs: 5.1 is .NET Framework and hands back an
          # HttpWebResponse, 7 is .NET and hands back an HttpResponseMessage
          # whose members differ. Testing one proves nothing about the other,
          # which is exactly how the PowerShell 7 break reached a release
          # candidate.
          - os: windows-2025
            name: windows-powershell-5.1
            run: powershell.exe -NoProfile -File install/install.ps1
            undo: powershell.exe -NoProfile -File install/uninstall.ps1
            bin: claude-statusline.exe
          - os: windows-2025
            name: windows-pwsh-7
            run: pwsh.exe -NoProfile -File install/install.ps1
            undo: pwsh.exe -NoProfile -File install/uninstall.ps1
            bin: claude-statusline.exe

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # A scratch profile, so a run never reads or writes the runner's real one
      # and every leg starts from "no previous installation". Both spellings are
      # set on every platform: the shell installers read $HOME and the
      # PowerShell ones read %USERPROFILE%, and setting the pair costs nothing.
      # RUNNER_TEMP arrives backslashed on Windows; the substitution normalises
      # it to a form bash and PowerShell both accept.
      - name: Point the profile at a scratch directory
        run: |
          # Under the *real* profile on Windows, not RUNNER_TEMP. The installer
          # refuses to place an executable into a directory that grants write
          # access to Users or Everyone -- correctly, since anyone who can write
          # there can swap the binary after it is verified -- and the runner's
          # `D:\a\_temp` grants exactly that. Probing there tested the guard
          # rather than the install. A subdirectory of the user profile inherits
          # the ACL a real installation actually lands on.
          if [ "$RUNNER_OS" = "Windows" ]; then
            base="${USERPROFILE//\\//}"
          else
            base="${RUNNER_TEMP//\\//}"
          fi
          scratch="$base/statusline-install-probe"
          rm -rf "$scratch"
          mkdir -p "$scratch"
          # `base` is exported too, because the steps below need the *real*
          # profile location and USERPROFILE is about to stop pointing at it.
          {
            echo "PROBE_BASE=$base"
            echo "HOME=$scratch"
            echo "USERPROFILE=$scratch"
            echo "PROBE=$scratch"
          } >> "$GITHUB_ENV"

      - name: Install from the prerelease channel
        run: |
          ${{ matrix.run }} --pre < /dev/null
          # Asserted here rather than left to the next step. `install.ps1`
          # returns 0 even when it refuses -- `exit` would close the session of
          # anyone running it through `irm | iex` -- so its exit code cannot be
          # the signal, and a refusal would otherwise sail through this step and
          # surface as a puzzling assertion failure further down. Reading an
          # exit code that cannot mean what it appears to is the same mistake
          # the stale `$LASTEXITCODE` gate made.
          test -e "$PROBE/.claude/bin/${{ matrix.bin }}" || {
            echo "::error::the installer exited without placing a binary; its output is above"
            exit 1
          }

      - name: It installed, it renders, and settings.json points at it
        run: |
          bin="$PROBE/.claude/bin/${{ matrix.bin }}"
          settings="$PROBE/.claude/settings.json"

          test -e "$bin" || { echo "::error::no binary at $bin"; exit 1; }
          "$bin" self-check \
            || { echo "::error::the installed binary fails its own self-check"; exit 1; }
          test -f "$settings" \
            || { echo "::error::settings.json was never written"; exit 1; }

          # Each entry separately. A merge that runs but writes less than it
          # claimed still exits 0 and looks identical from outside, which is the
          # failure mode the exit-0 exemption on `settings` exists to expose.
          for key in claude-statusline subagentStatusLine git-refresh; do
            grep -q "$key" "$settings" || {
              echo "::error::settings.json is missing $key"
              cat "$settings"
              exit 1
            }
          done
          echo "installed, renders, and settings.json points at it"

      # Windows has to store the command quoted, or a profile directory
      # containing a space word-splits it, the binary never runs, and the
      # silent-degradation contract hides the failure completely.
      - name: The Windows command is stored quoted
        if: runner.os == 'Windows'
        run: |
          grep -q '"command": *"\\"' "$PROBE/.claude/settings.json" || {
            echo "::error::the Windows command is stored unquoted"
            cat "$PROBE/.claude/settings.json"
            exit 1
          }
          echo "the stored command is quoted"

      # A re-run has to be a no-op rather than a second set of entries. The hook
      # writer de-duplicates by binary path, and nothing else asserts it does.
      - name: Installing twice changes nothing
        run: |
          settings="$PROBE/.claude/settings.json"
          before=$(cksum < "$settings")
          ${{ matrix.run }} --pre < /dev/null
          after=$(cksum < "$settings")
          if [ "$before" != "$after" ]; then
            echo "::error::settings.json changed on re-install"
            cat "$settings"
            exit 1
          fi
          echo "re-install left settings.json byte-identical"

      # The rollback. CLAUDE.md makes this the installers' central promise --
      # nothing irreversible before the self-check passes, the previous binary
      # restored and settings.json untouched when it fails -- and until this
      # step existed, the failure branch had never once run. The suite's
      # `the_self_check_gates_every_destructive_step` compares string positions
      # in the script text, and every other self-check here is handed a binary
      # that passes, so the whole recovery path was covered by reading alone.
      # A real defect was found in it (the sweep that deleted the evidence),
      # which is the argument for executing it rather than reading it.
      #
      # STATUSLINE_FORCE_SELFCHECK_MISMATCH makes the freshly-placed binary
      # render the wrong thing, so the installer meets a genuine failure at
      # exactly the point being tested. The installer's own exit code is not
      # the signal: `install.ps1` returns 0 even when it refuses, because
      # `exit` would close the session of anyone running it through `irm|iex`.
      # State is the signal.
      - name: A failing self-check rolls back and touches nothing
        run: |
          bin="$PROBE/.claude/bin/${{ matrix.bin }}"
          settings="$PROBE/.claude/settings.json"
          bin_before=$(cksum < "$bin")
          settings_before=$(cksum < "$settings")

          # Scoped to the install alone, and never step-level env: self_check()
          # honors the variable in whatever binary runs with it set, so a
          # step-wide value poisons the restored binary's own render assertion
          # below — the good binary "fails", on every platform at once.
          STATUSLINE_FORCE_SELFCHECK_MISMATCH=1 ${{ matrix.run }} --pre < /dev/null || true

          # The previous working installation is back, byte for byte, and still
          # renders. A restore that put back something else would pass a mere
          # existence check.
          test -e "$bin" || {
            echo "::error::the failing self-check left no binary at all"; exit 1; }
          if [ "$bin_before" != "$(cksum < "$bin")" ]; then
            echo "::error::the previous binary was not restored after a failed self-check"
            exit 1
          fi
          "$bin" self-check || {
            echo "::error::the restored binary does not render"; exit 1; }

          # Untouched means untouched.
          if [ "$settings_before" != "$(cksum < "$settings")" ]; then
            echo "::error::settings.json was rewritten despite a failed self-check"
            exit 1
          fi

          # The two artifacts the installer tells the user to attach to a bug
          # report. They are named outside the staged-download prefix on
          # purpose: that prefix is swept before the next download, and
          # re-running the installer is the first thing anyone does after a
          # failed install, so naming them with it destroyed the evidence
          # before the retry began.
          for artifact in claude-statusline.self-check.txt claude-statusline.failed; do
            test -e "$PROBE/.claude/bin/$artifact" || {
              echo "::error::$artifact is missing after a failed self-check"
              ls -la "$PROBE/.claude/bin"
              exit 1
            }
          done
          if ls "$PROBE/.claude/bin/.claude-statusline.stage."* >/dev/null 2>&1; then
            echo "::error::the failed run left staged files behind"
            ls -la "$PROBE/.claude/bin"
            exit 1
          fi
          echo "rolled back, settings.json untouched, evidence kept"

      # The evidence is kept for a retry that fails again, not forever: once a
      # run succeeds the user has a working install and nothing left to report.
      - name: A passing self-check clears the evidence
        run: |
          ${{ matrix.run }} --pre < /dev/null
          for artifact in claude-statusline.self-check.txt claude-statusline.failed; do
            test ! -e "$PROBE/.claude/bin/$artifact" || {
              echo "::error::$artifact survived a successful install"
              exit 1
            }
          done
          echo "a successful install cleared the evidence"

      - name: Uninstall removes the binary and every entry
        run: |
          ${{ matrix.undo }} < /dev/null
          bin="$PROBE/.claude/bin/${{ matrix.bin }}"
          settings="$PROBE/.claude/settings.json"

          test ! -e "$bin" || { echo "::error::the binary survived uninstall"; exit 1; }
          if grep -q 'claude-statusline' "$settings"; then
            echo "::error::settings.json still references the binary after uninstall"
            cat "$settings"
            exit 1
          fi
          echo "uninstall left no binary and no entries"

      # The failure evidence is deliberately named outside the staged prefix so
      # a retry keeps it — which also means no sweep but the uninstaller's own
      # ever removes it, and the two files kept the bin directory alive after
      # every uninstall that followed a failed install.
      - name: Uninstall after a failed install takes the evidence with it
        run: |
          # Scoped for the same reason as the rollback scenario above.
          STATUSLINE_FORCE_SELFCHECK_MISMATCH=1 ${{ matrix.run }} --pre < /dev/null || true
          test -e "$PROBE/.claude/bin/claude-statusline.self-check.txt" || {
            echo "::error::the scenario did not recreate the failure evidence"; exit 1; }

          ${{ matrix.undo }} < /dev/null

          if [ -d "$PROBE/.claude/bin" ]; then
            echo "::error::uninstall after a failed install left the bin directory behind"
            ls -la "$PROBE/.claude/bin"
            exit 1
          fi
          echo "uninstall removed the evidence and the empty directory"

      # The stable channel, which every step above leaves untested. `--pre`
      # resolves through the releases atom feed; the stable path resolves
      # through the `/releases/latest` redirect, and *both* release-resolution
      # defects lived there — the `BaseResponse.ResponseUri` read that does not
      # exist on PowerShell 7, and the sentinel that guarded against the literal
      # `latest` while the real redirect lands on `releases`.
      #
      # Self-adjusting rather than pinned to today's answer: it asks GitHub what
      # `/releases/latest` currently resolves to and asserts whichever outcome is
      # correct for that. Before the first stable tag it must refuse and change
      # nothing; after it, it must install. Nothing here needs revisiting when
      # v1.0.0 lands, which is the point — a step that has to be flipped by hand
      # is a step that gets flipped late.
      #
      # Asserted on output and side effects, never the exit code: the two
      # dialects legitimately disagree there. `install.sh` aborts through
      # CLAUDE.md's `return 1 2>/dev/null || exit 1` and exits 1; `install.ps1`
      # uses a bare `return` and exits 0, because `exit` would close the session
      # of a user running it through `irm | iex`.
      - name: The stable channel resolves or refuses, whichever is true today
        run: |
          # PROBE_BASE, not USERPROFILE: that now points at the install probe.
          probe="$PROBE_BASE/statusline-stable-probe"
          rm -rf "$probe"
          mkdir -p "$probe"
          log="$probe/install.log"

          # The slug the installers hardcode. Kept in step with REPO_SLUG /
          # $repoSlug in install/install.sh and install/install.ps1.
          slug="axlaser/claude-statusline"
          effective=$(curl -fsSLI -o /dev/null -w '%{url_effective}' \
            "https://github.com/$slug/releases/latest" 2>/dev/null || true)
          tag="${effective##*/}"
          echo "releases/latest currently resolves to: '$tag'"

          # The installer aborts here by design in one of the two branches, and
          # the job's `-e` would treat that as a step failure.
          set +e
          HOME="$probe" USERPROFILE="$probe" ${{ matrix.run }} < /dev/null > "$log" 2>&1
          set -e
          cat "$log"

          bin="$probe/.claude/bin/${{ matrix.bin }}"
          case "$tag" in
            v[0-9]*)
              test -e "$bin" || {
                echo "::error::a stable release ($tag) exists, but the stable channel installed nothing"
                exit 1
              }
              "$bin" self-check || {
                echo "::error::the stable channel installed a binary that fails its own self-check"
                exit 1
              }
              echo "stable channel installed $tag and it renders"
              ;;
            *)
              grep -qi 'no stable release' "$log" || {
                echo "::error::no stable release exists, but the installer did not say so"
                echo "::error::this is the '$tag' sentinel defect: it used to proceed and 404"
                exit 1
              }
              test ! -e "$bin" || {
                echo "::error::the installer refused but placed a binary anyway"
                exit 1
              }
              echo "stable channel correctly refused: no stable release published yet"
              ;;
          esac

  # The upgrade, which is the highest-risk path in the release and the only one
  # that deletes files a user already has. It is separated from the matrix above
  # because it needs a script installation staged first, and because its failure
  # means something different: not "the install is broken" but "upgrading breaks
  # a working setup".
  #
  # The scripts themselves are gone from the tree, so the stand-ins are files at
  # the paths a v0.1.0 installation left behind, with settings.json pointing at
  # them exactly as the released script installers wrote it. What is under test
  # is the migration's ordering -- that the scripts are removed only after
  # settings.json points at the binary -- not the scripts' own behaviour.
  upgrade:
    name: upgrade from a script installation
    runs-on: ubuntu-24.04
    needs: gates

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Stage a v0.1.0 script installation
        run: |
          scratch="${RUNNER_TEMP}/upgrade-probe"
          mkdir -p "$scratch/.claude"
          echo "HOME=$scratch" >> "$GITHUB_ENV"
          echo "PROBE=$scratch" >> "$GITHUB_ENV"

          for s in statusline notify git-refresh subagent-statusline; do
            printf '#!/usr/bin/env bash\necho legacy\n' > "$scratch/.claude/$s.sh"
            chmod +x "$scratch/.claude/$s.sh"
          done

          # The shape the script installers wrote: a bare tilde path, and the
          # notify hooks a user who had enabled notifications would carry.
          cat > "$scratch/.claude/settings.json" <<'JSON'
          {
            "theme": "dark",
            "statusLine": { "type": "command", "command": "~/.claude/statusline.sh" },
            "hooks": {
              "PermissionRequest": [
                { "hooks": [ { "type": "command", "command": "~/.claude/notify.sh permission" } ] }
              ]
            }
          }
          JSON
          echo "staged 4 scripts and a settings.json pointing at them"

      - name: Upgrade
        run: bash install/install.sh --pre < /dev/null

      - name: The scripts are gone, the binary is wired in, and the user's keys survive
        run: |
          settings="$PROBE/.claude/settings.json"
          cat "$settings"

          for s in statusline notify git-refresh subagent-statusline; do
            test ! -e "$PROBE/.claude/$s.sh" \
              || { echo "::error::$s.sh survived the upgrade"; exit 1; }
          done

          # The ordering guarantee, stated as an outcome: no entry may still
          # point at a script this run deleted. That pairing -- scripts removed,
          # settings.json left pointing at them -- is the failure d9e61f4 fixed,
          # and it leaves a user with no status line and nothing to fall back to.
          grep -q '\.claude/statusline\.sh' "$settings" \
            && { echo "::error::settings.json still points at a deleted script"; exit 1; }
          grep -q 'claude-statusline' "$settings" \
            || { echo "::error::settings.json does not point at the binary"; exit 1; }

          # Notifications were on before, so they stay on without re-prompting --
          # and this job answers no to every prompt, so an entry here can only
          # have come from the legacy hook being recognised.
          grep -q 'notify permission' "$settings" \
            || { echo "::error::the upgrade dropped the user's notification setting"; exit 1; }

          # Unrelated keys are the user's, not ours.
          grep -q '"theme"' "$settings" \
            || { echo "::error::the upgrade discarded an unrelated user key"; exit 1; }

          "$PROBE/.claude/bin/claude-statusline" self-check \
            || { echo "::error::the upgraded binary fails its own self-check"; exit 1; }
          echo "upgraded: scripts removed, binary wired in, user settings intact"
