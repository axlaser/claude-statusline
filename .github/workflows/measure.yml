name: measure

# Produces interleaved before/after medians for two builds of this crate, on
# macOS and Linux.
#
# Both halves of a pair have to come from a single hosted runner within one job,
# with the runs interleaved. Two jobs, or two workflow runs, would hand back
# numbers taken on different machines under different load and present them as a
# comparison — which is the mistake docs/performance.md §3 exists to prevent. So
# each platform is one job that builds both variants and measures them itself.
#
# This workflow used to invoke `measure.sh`, which paired a runtime script
# against the binary that replaced it. Those script trees were deleted at
# `1f5acf2`, so the driver aborted on a missing-file check and this workflow
# could not run at all. It now drives `measure-pair.sh`, which pairs two commits
# of the crate — the question anyone actually has once the scripts are gone.
#
# Windows pairs are deliberately absent, for the same reason that keeps Windows
# capture off CI: the numbers that matter there are the maintainer's machine,
# not a hosted image nobody runs the status line on.
#
# Results are uploaded, never committed by this workflow. Which numbers reach
# docs/performance.md is a decision a person makes.

on:
  # `measure-*` cannot collide with the release workflow, which triggers only on
  # `v<major>.<minor>.<patch>[-suffix]` and `verify-*`, nor with `capture-*`.
  # A tag-triggered run measures that tag's commit against its first parent.
  push:
    tags:
      - "measure-*"

  workflow_dispatch:
    inputs:
      before:
        description: "The baseline ref (default: the head commit's first parent)"
        required: false
        type: string
      after:
        description: "The ref under test (default: the head commit)"
        required: false
        type: string
      runs:
        description: "Interleaved pairs per mode (>= 7)"
        required: false
        type: string
        default: "15"
      modes:
        description: "Tick shapes to measure, comma-separated: warm, git-miss, cold"
        required: false
        type: string
        default: "warm,git-miss,cold"
      git_state:
        description: "A state from tests/harness/states.json"
        required: false
        type: string
        default: dirty
      transcript_bytes:
        description: "Generated transcript size in bytes"
        required: false
        type: string
        default: "8388608"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  measure:
    name: measure (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: macos
            runner: macos-15

    steps:
      - name: Check out the full history
        # Pinned by sha: a paired measurement that silently ran a different
        # action version is a number nobody can reproduce.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Both variants are built from this checkout, so the whole history has
          # to be here — a shallow clone cannot reach the baseline ref.
          fetch-depth: 0

      - name: Resolve the pair
        id: pair
        env:
          IN_BEFORE: ${{ inputs.before }}
          IN_AFTER: ${{ inputs.after }}
        run: |
          set -euo pipefail
          after="${IN_AFTER:-$(git rev-parse HEAD)}"
          before="${IN_BEFORE:-$(git rev-parse "${after}^")}"
          git rev-parse --verify "${before}^{commit}" >/dev/null
          git rev-parse --verify "${after}^{commit}" >/dev/null
          printf 'before=%s\n' "$(git rev-parse "$before")" >> "$GITHUB_OUTPUT"
          printf 'after=%s\n' "$(git rev-parse "$after")" >> "$GITHUB_OUTPUT"

      - name: Install a bash new enough for EPOCHREALTIME
        if: matrix.platform == 'macos'
        run: brew install bash

      - name: Record the toolchain
        run: |
          rustc --version
          cargo --version
          git --version
          jq --version

      - name: Build both variants
        env:
          BEFORE: ${{ steps.pair.outputs.before }}
          AFTER: ${{ steps.pair.outputs.after }}
        run: |
          set -euo pipefail
          mkdir -p measured/bin
          # A worktree rather than a checkout, so the harness scripts under test
          # stay the ones from the head commit for both halves of the pair.
          git worktree add --detach ../before-tree "$BEFORE"
          ( cd ../before-tree && cargo build --release --locked )
          cp ../before-tree/target/release/claude-statusline measured/bin/before
          git worktree add --detach ../after-tree "$AFTER"
          ( cd ../after-tree && cargo build --release --locked )
          cp ../after-tree/target/release/claude-statusline measured/bin/after

      - name: Ad-hoc sign both variants
        if: matrix.platform == 'macos'
        run: |
          set -euo pipefail
          for v in before after; do
            codesign --sign - --force --timestamp=none "measured/bin/$v"
            codesign --verify --strict "measured/bin/$v"
          done

      - name: Measure
        env:
          MEASURE_HOST_CLASS: hosted runner
          IN_RUNS: ${{ inputs.runs }}
          IN_MODES: ${{ inputs.modes }}
          IN_GIT_STATE: ${{ inputs.git_state }}
          IN_TRANSCRIPT_BYTES: ${{ inputs.transcript_bytes }}
          BEFORE: ${{ steps.pair.outputs.before }}
          AFTER: ${{ steps.pair.outputs.after }}
        run: |
          set -euo pipefail
          # The runner label and image version travel with the number: §3 makes
          # host class part of the measurement, and a hosted-runner figure held
          # against a bare-metal baseline is worse than no figure.
          printf 'runner: %s\nimage: %s %s\nbefore: %s\nafter: %s\n' \
            "${{ matrix.runner }}" "${ImageOS:-unknown}" "${ImageVersion:-unknown}" \
            "$BEFORE" "$AFTER" | tee measured/${{ matrix.platform }}-host.txt
          bash tests/harness/measure-pair.sh \
            --before measured/bin/before \
            --after measured/bin/after \
            --runs "${IN_RUNS:-15}" \
            --mode "${IN_MODES:-warm,git-miss,cold}" \
            --git-state "${IN_GIT_STATE:-dirty}" \
            --transcript-bytes "${IN_TRANSCRIPT_BYTES:-8388608}" \
            --json "measured/${{ matrix.platform }}.json"

      - name: Confirm something was measured
        run: |
          set -euo pipefail
          f="measured/${{ matrix.platform }}.json"
          if [[ ! -s $f ]]; then
            echo "::error::the driver reported success but wrote no measurement"
            exit 1
          fi
          cat "$f"

      - name: Upload the measurement
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: measured-${{ matrix.platform }}
          path: |
            measured/${{ matrix.platform }}.json
            measured/${{ matrix.platform }}-host.txt
          if-no-files-found: error
          retention-days: 14
